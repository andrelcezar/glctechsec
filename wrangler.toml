# Cloudflare Workers — glctechsec.com
#
# IMPORTANT: assets.directory is ./dist, NOT the repo root.
# Pointing it at "." uploads node_modules (which broke the build on a 122 MiB
# workerd binary) and would also publish tests/, docs/ and serverless/ source.
# dist/ is built by scripts/build.mjs from an explicit allowlist.

name = "glctechsec"
main = "worker/index.js"
compatibility_date = "2026-08-10"

[observability]
enabled = true

# dist/ is generated (and gitignored), so it does not exist in a fresh clone.
# Declaring the build here means `wrangler deploy` produces it itself, rather
# than depending on the host's build command being configured correctly.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# /about resolves to /about.html (html_handling default). There is no
# dist/404.html yet, so "404-page" would be a no-op; keep this honest.
not_found_handling = "none"

# Secrets are NOT set here. They are encrypted, and set with:
#   npx wrangler secret put ZOHO_USER     # contact@glctechsec.com
#   npx wrangler secret put ZOHO_PASS     # Zoho app-specific password
#   npx wrangler secret put CONTACT_TO    # contact@glctechsec.com

# Optional flood guard for the contact endpoint. The Worker runs without it.
#   npx wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<paste the id wrangler prints>"
