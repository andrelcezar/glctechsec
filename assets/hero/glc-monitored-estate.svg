<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="est-t est-d" font-family="DM Sans, Segoe UI, sans-serif">
<title id="est-t">A monitored estate</title>
<desc id="est-d">Topology of a typical monitored client estate: internet edge and firewall feeding a core switch, which serves virtualisation hosts, physical servers, network devices and endpoints, with every layer reporting into GLCTech monitoring over SNMP and agents.</desc>
<rect width="900" height="720" fill="#1f1f1f"/>
<defs><pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M 45 0 L 0 0 0 45" fill="none" stroke="#2b2b2b" stroke-width="1"/></pattern></defs>
<rect width="900" height="720" fill="url(#grid)"/>
<text x="28" y="48" fill="#ffffff" font-size="18" font-weight="700" font-family="Syne, sans-serif">What we watch</text>
<text x="28" y="70" fill="#8a8a8a" font-size="12">Every layer reports in — so a failure is a ticket, not a phone call from your client.</text>
<line x1="28" y1="86" x2="872" y2="86" stroke="#3d3d3d"/>
<path d="M 450.0 154.0 C 450.0 179.0 450.0 179.0 450.0 204.0" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
