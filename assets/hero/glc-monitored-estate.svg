<circle cx="144.0" cy="566" r="5" fill="#e6262c"/>
<text x="160.0" y="564.0" fill="#ffffff" font-size="13" font-weight="600">GLCTech monitoring</text>
<text x="160.0" y="581.0" fill="#8a8a8a" font-size="10.5">SNMP · agents · API checks — 24/7, with escalation</text>
<text x="756.0" y="570.0" fill="#4ade80" font-size="11" font-weight="600" text-anchor="end">99.98% availability</text>
