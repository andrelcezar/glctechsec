<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="bk-t bk-d" font-family="DM Sans, Segoe UI, sans-serif">
<title id="bk-t">Backup and continuity console</title>
<desc id="bk-d">Example console: last successful backup 41 minutes ago, 12 minute recovery point objective, 100 percent job success over 30 days and 28 recovery points retained, with a 3-2-1 copy diagram and recent job list.</desc>
